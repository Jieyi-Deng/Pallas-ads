<!doctype html>
<html lang="$lang">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>$title</title>
<style>
:root{--ink:#17191c;--t2:#4a4f57;--t3:#6b717a;--t4:#9aa0a8;--line:#e3e5e8;--line2:#d6d9dd;--line3:#c9ccd1;--panel:#f7f7f6;--link:#2f4f7a;--bar:#6b717a;--acc:#3d6496;--acc-soft:#eef3fa;--acc-tint:#f3f6fa;--acc-text:#2f5282;--hatch:repeating-linear-gradient(135deg,#5b616a 0 1.5px,transparent 1.5px 5px);--sans:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif;--mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'PingFang SC',monospace}
@supports (color:oklch(0.5 0.1 250)){:root{--acc:oklch(0.5 0.1 250);--acc-soft:oklch(0.965 0.015 250);--acc-tint:oklch(0.975 0.01 250);--acc-text:oklch(0.42 0.1 250)}}
html,body{margin:0;background:#f4f4f2;color:var(--ink);-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
a{color:var(--link);text-decoration:underline;text-underline-offset:2px}
a:hover{color:var(--ink)}
h1,h2,h3,h4,p,dl,dd{margin:0}
ul,ol{margin:0;padding:0;list-style:none}
.page{font-family:var(--sans);font-size:14px;line-height:1.5;padding:32px 20px 64px;overflow-wrap:anywhere}
.paper{max-width:1120px;margin:0 auto;background:#fff;box-shadow:0 1px 2px rgba(20,22,25,.06),0 0 0 1px #e6e7e9;padding:clamp(24px,5vw,64px);display:flex;flex-direction:column;gap:64px}
.mono,.lab,.k,.num,.chip,th{font-family:var(--mono)}
.lab{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--t3)}
.small,.note{font-size:12px;color:var(--t3);text-wrap:pretty}
.muted{color:var(--t2)}
header.top{display:flex;flex-direction:column;gap:28px}
.brandbar{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:18px}
.brand{display:flex;align-items:center;gap:6px}
.brand img{width:72px;height:72px;margin:-10px -8px -10px -14px;display:block}
.wordmark{font-size:20px;font-weight:600;letter-spacing:.01em}
.kicker{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--t2)}
.hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:32px;align-items:end}
.hero-text{display:flex;flex-direction:column;gap:12px}
h1{font-size:clamp(34px,4.6vw,52px);line-height:1.04;font-weight:600;letter-spacing:-.02em;text-wrap:balance}
.subtitle{font-size:18px;color:var(--t2);text-wrap:pretty;max-width:560px}
.meta{display:grid;grid-template-columns:auto 1fr;gap:6px 20px;font-size:13px;border-left:1px solid var(--line);padding-left:20px}
.meta .k{font-size:11px;color:var(--t3);text-transform:uppercase;letter-spacing:.06em;padding-top:2px}
.key{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;background:var(--panel);padding:12px 16px;font-size:12px;color:var(--t2)}
.key>span{display:flex;align-items:center;gap:8px}
.key .lab{color:var(--ink)}
.banner{border:1px dashed var(--t2);background:var(--panel);padding:12px 16px;font-size:13px;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.chip{display:inline-block;font-size:10px;line-height:1.5;letter-spacing:.06em;text-transform:uppercase;padding:1px 6px;border:1px solid var(--ink);color:var(--ink);white-space:nowrap;vertical-align:baseline}
.chip.mini{font-size:10px;padding:0 4px;letter-spacing:.04em}
.c-verified{border-color:var(--ink);color:var(--ink)}
.c-observed{border-color:var(--t2);color:var(--t2)}
.c-estimate{border-color:#5b616a;color:#3a3e44;background:linear-gradient(#fff,#fff) padding-box,var(--hatch) border-box;border-width:1px 1px 1px 6px}
.c-inference{border-style:dashed;border-color:var(--t2);color:var(--t2)}
.c-hypothesis{border-style:dashed;border-color:var(--acc);color:var(--acc-text)}
.c-unavailable{border-style:dotted;border-color:var(--t4);color:var(--t3);background:#f0f1f2}
.c-subject{border-color:var(--acc);color:var(--acc-text);background:var(--acc-soft)}
.hatch{display:inline-block;width:22px;height:10px;border:1px solid #5b616a;background:var(--hatch)}
.cite{font-family:var(--mono);font-size:11px;color:var(--t3);white-space:normal;line-height:1.6}
.cite a{color:var(--t2);white-space:nowrap}
.refs{font-size:12px;color:var(--t3);white-space:normal}
.ev{display:inline-flex;flex-wrap:wrap;gap:4px 6px;align-items:baseline}
section.sec{display:flex;flex-direction:column;gap:22px}
.sec-head{display:flex;align-items:baseline;gap:14px;border-top:1.5px solid var(--ink);padding-top:14px;flex-wrap:wrap}
.sec-head .num{font-size:16px;font-weight:500;line-height:1;color:var(--t3);letter-spacing:-.01em}
h2{font-size:24px;font-weight:600;letter-spacing:-.01em}
.sec-head .chip{margin-left:auto}
.lead{font-size:15px;max-width:760px;text-wrap:pretty}
h3{font-size:15px;font-weight:600;line-height:1.3}
h4{font-size:14px;font-weight:600;line-height:1.45}
.findings{border-bottom:1px solid var(--line)}
.finding{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:32px;padding:24px 0;border-top:1px solid var(--line);break-inside:avoid}
.finding h3{font-size:18px;line-height:1.45;text-wrap:pretty}
.finding-body,.observation-body{display:flex;flex-direction:column;align-items:flex-start;gap:10px;min-width:0}
.finding-body p,.observation-body>p{font-size:14px;line-height:1.65;color:var(--t2);max-width:74ch}
.finding>div,.observation>*{min-width:0}
.finding .small{margin-bottom:8px}
.observation-list{border-bottom:1px solid var(--line)}
.observation{display:grid;grid-template-columns:180px minmax(0,1fr);gap:28px;border-top:1px solid var(--line);padding:24px 0;break-inside:avoid}
.observation-context{display:flex;flex-direction:column;align-items:flex-start;gap:8px;font-size:12px;color:var(--t2)}
.observation-body .small,.observation-body .note{font-size:12px;color:var(--t3)}
.metrics-table{min-width:640px;table-layout:fixed}
.metrics-table th:first-child{width:25%}
.metrics-table th:nth-child(2){width:21%}
.metrics-table th[scope=row]{font:inherit;color:var(--ink);vertical-align:top;border-bottom:1px solid var(--line);letter-spacing:normal;text-transform:none}
.metrics-table td .chip{white-space:normal}
.sub{display:flex;flex-direction:column;gap:12px}
.subhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}
.card{padding:18px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px;break-inside:avoid}
.card h3{font-size:16px}
.card p{font-size:13px;color:var(--t2);text-wrap:pretty}
.card.acc{background:var(--acc-tint)}
.card.acc .lab{color:var(--acc-text)}
.card.na{background:#fafafa}
.card .foot{margin-top:auto;padding-top:6px}
.line{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;font-size:14px}
.line>span:last-child{flex:1;min-width:260px;text-wrap:pretty}
.legend{display:flex;gap:8px 18px;flex-wrap:wrap;font-size:12px;color:var(--t2);align-items:center}
.legend>span{display:flex;align-items:center;gap:6px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
table.w880{min-width:880px}table.w760{min-width:760px}table.w640{min-width:640px}
.landscape-table{min-width:var(--landscape-min,970px);table-layout:auto;overflow-wrap:break-word;word-break:normal}
.landscape-table .profile-col{width:160px;min-width:160px}
.landscape-table .class-col{width:96px}
th{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--t3);font-weight:400;text-align:left;padding:8px 12px;border-bottom:1px solid var(--ink);vertical-align:bottom}
td{padding:12px;border-bottom:1px solid var(--line);vertical-align:top;text-wrap:pretty}
th:first-child,td:first-child{padding-left:0}
tr.subj td{background:var(--acc-soft)}
tr.subj td:first-child{box-shadow:inset 3px 0 0 var(--acc);padding-left:12px}
.landscape-table th:first-child,.landscape-table td:first-child{padding-left:12px}
td .name{font-weight:600}
td .desc{font-size:12px;color:var(--t3)}
td.n,th.n{text-align:center;font-family:var(--mono)}
td.h1c{background:#f2f3f4}td.h2c{background:#dfe1e4}td.h3c{background:#c9ccd1}
td.none{color:var(--t3)}
th.subj{color:var(--acc-text)}
td.subjcol{background:var(--acc-tint)}
.val{font-family:var(--mono);font-size:12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.tile{background:#fff;padding:14px 16px;display:flex;flex-direction:column;gap:4px;break-inside:avoid}
.tile .v{font-size:22px;font-weight:600;font-family:var(--mono);line-height:1.2}
.tile .l{font-size:12px;color:var(--t2)}
.tile.na{background:var(--panel)}
.tile.na .v{color:var(--t3)}
.tile.est .v{text-decoration:underline;text-decoration-style:dashed;text-decoration-color:#5b616a;text-underline-offset:5px}
.tile.inf .v{font-size:15px;font-weight:500;font-family:var(--sans);color:var(--t2)}
.chart{display:grid;grid-template-columns:150px minmax(0,1fr) 210px;gap:0 14px;align-items:center;font-size:13px}
.chart .axis{position:relative;height:18px;font-family:var(--mono);font-size:10px;color:var(--t3)}
.chart .axis span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.chart .axis span:first-child{transform:none}
.chart .axis span:last-child{transform:translateX(-100%)}
.chart .who{padding:6px 0}
.chart .who.subj{font-weight:600;color:var(--acc-text)}
.track{position:relative;height:28px;background:linear-gradient(90deg,#eef0f2 1px,transparent 1px) 0 0/25% 100%;border-left:1px solid var(--line3)}
.bar{position:absolute;top:9px;height:10px;background:var(--bar)}
.bar.subj{top:7px;height:14px;background:var(--acc)}
.bar.est{background:var(--hatch);border:1px solid #5b616a}
.bar.est.subj{background:repeating-linear-gradient(135deg,var(--acc) 0 1.5px,transparent 1.5px 5px);border-color:var(--acc)}
.dot{position:absolute;top:8px;width:12px;height:12px;margin-left:-6px;background:var(--bar);transform:rotate(45deg)}
.dot.subj{background:var(--acc)}
.dot.est{background:var(--hatch);border:1px solid #5b616a}
.track.na{background:none;border-left:1px dotted var(--t4);display:flex;align-items:center;padding-left:10px;font-size:12px;color:var(--t3)}
.chart .lbl{display:flex;flex-direction:column;gap:2px;font-size:12px;padding:4px 0}
.chart .lbl .val{color:var(--t2)}
.chart .lbl.subj .val{color:var(--acc-text);font-weight:500}
.dots{display:inline-flex;align-items:center;gap:8px}
.d{display:inline-block;width:10px;height:10px;border-radius:50%}
.d-full{background:var(--ink)}
.d-half{background:linear-gradient(90deg,var(--ink) 50%,#fff 50%);border:1px solid var(--ink)}
.d-hatch{background:var(--hatch);border:1px solid #5b616a}
.d-dash{border:1px dashed var(--t2)}
.d-empty{border:1px solid var(--t4)}
.pcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}
.pcard{padding:18px 18px 16px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px;break-inside:avoid}
.pcard p{font-size:13px;color:var(--t2);text-wrap:pretty}
.seen{display:grid;grid-template-columns:72px minmax(0,1fr);row-gap:5px;column-gap:8px;margin-top:auto;padding-top:12px;border-top:1px dashed var(--line2);font-size:12px;line-height:1.35;align-items:baseline}
.seen .k{font-size:9.5px;letter-spacing:.08em;color:var(--t3);text-transform:uppercase}
.seen .s{color:var(--acc-text);font-weight:500}
.seen .s.no{color:var(--t3);font-weight:400}
.journey{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr))}
.stage{display:flex;flex-direction:column;gap:10px;padding:0 14px 14px 0;break-inside:avoid}
.chev{color:#fff;padding:12px 14px;font-weight:600;font-size:14px;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 50%,calc(100% - 10px) 100%,0 100%)}
.chev .mono{font-size:10px;opacity:.75;display:block;font-weight:400}
.chev.last{clip-path:none;background:var(--line)!important;color:var(--ink)}
.stage ul{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--t2)}
.cal{min-width:760px;display:grid;grid-template-columns:220px repeat(24,minmax(0,1fr));row-gap:8px;font-size:12.5px;align-items:center}
.cal .m{font-family:var(--mono);font-size:10px;color:var(--t3);border-left:1px solid var(--line);padding-left:4px}
.cal .ev-lbl{grid-column:1;padding-right:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.cal .ev-lbl .chip{white-space:normal}
.cal .win{height:14px;background:var(--ink)}
.cal .lt{height:14px;border:1px solid #5b616a;background:var(--hatch)}
.swot{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:1px;background:var(--line2);border:1px solid var(--line2)}
.quad{background:#fff;padding:20px;display:flex;flex-direction:column;gap:12px;break-inside:avoid}
.quad.opportunity{background:var(--acc-tint)}
.quad.threat{background:var(--panel)}
.quad .qh{display:flex;justify-content:space-between;align-items:baseline}
.quad h3{font-size:16px}
.quad ul{display:flex;flex-direction:column;gap:8px;font-size:13.5px}
.quad li{display:flex;gap:10px}
.quad li::before{content:"—";color:var(--t3)}
.opps{border-bottom:1px solid var(--line)}
.opp{display:flex;flex-direction:column;align-items:flex-start;gap:16px;padding:28px 0;border-top:1px solid var(--line);break-inside:avoid}
.opp h3{font-size:18px;line-height:1.45}
.pattern-meta{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:baseline;color:var(--t3);font-size:12px}
.reasoning{display:flex;flex-direction:column;gap:14px;width:100%;font-size:14px;line-height:1.65;color:var(--t2)}
.reason-pair{display:grid;grid-template-columns:7.5rem minmax(0,1fr);gap:16px}
.reason-pair dt{font-size:12px;color:var(--t3);padding-top:2px}
.reason-pair dd{max-width:74ch;min-width:0}
:lang(zh-CN) .reason-pair{grid-template-columns:5em minmax(0,1fr)}
.matrix-box{display:flex;flex-direction:column;gap:10px;min-width:0;flex:1 1 280px;max-width:400px;break-inside:avoid}
.matrix{display:grid;grid-template-columns:18px minmax(0,1fr);gap:6px}
.matrix .ax{font-family:var(--mono);font-size:10px;color:var(--t3);text-align:center;letter-spacing:.08em}
.matrix .ax.y{writing-mode:vertical-rl;transform:rotate(180deg)}
:lang(zh-CN) .matrix .ax.y{transform:none;text-orientation:upright}
.plane{position:relative;aspect-ratio:1/1;border:1px solid var(--line3);background:linear-gradient(90deg,var(--line) 1px,transparent 1px) 0 0/33.333% 100%,linear-gradient(var(--line) 1px,transparent 1px) 0 0/100% 33.333%}
.plane .q{position:absolute;font-family:var(--mono);font-size:9.5px;color:var(--t3);letter-spacing:.06em}
.plane .pt.low{background:#fff;border:1px solid var(--ink);color:var(--ink)}
.plane .pt{position:absolute;transform:translate(-50%,-50%);width:28px;height:28px;border-radius:50%;background:var(--ink);color:#fff;font-family:var(--mono);font-size:11px;display:flex;align-items:center;justify-content:center}
.band{display:flex;flex-direction:column;gap:22px;background:var(--ink);color:#f4f4f2;margin:0 calc(-1 * clamp(24px,5vw,64px));padding:40px clamp(24px,5vw,64px)}
.band .sec-head{border-top-color:#f4f4f2}
.band .sec-head .num{color:#a5aab2}
.band .lead{color:#d7dade}
.band-grid{display:flex;flex-direction:column}
.band-item{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:32px;border-top:1px solid #3a3e44;padding:24px 0;break-inside:avoid}
.band-item:last-child{padding-bottom:0}
.gap-detail{display:flex;flex-direction:column;gap:16px;min-width:0;max-width:74ch}
.band-item .mono{font-size:12px;color:#a5aab2}
.band-item h3{font-size:16px;font-weight:500;line-height:1.35}
.band-item p{font-size:14px;line-height:1.65;color:#c3c7cc;text-wrap:pretty}
.band-item .ask p{color:#f4f4f2}
.band-item .ask h4{font-size:12px;font-weight:400;color:#c3c7cc;margin-bottom:6px}
footer.foot{display:flex;flex-direction:column;gap:18px;font-size:12px;color:var(--t3);margin-top:-24px}
footer .block{display:flex;flex-direction:column;gap:6px;max-width:900px}
footer .block .lab{color:var(--t2)}
.sources{display:flex;flex-direction:column;gap:16px}
.sources li{display:flex;flex-direction:column;gap:3px;text-wrap:pretty;overflow-wrap:anywhere}
.source-publisher{font-weight:600;color:var(--t2)}
.sources li:target{background:var(--acc-soft)}
.sources .sid{font-family:var(--mono);color:var(--ink);margin-right:6px}
.endline{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px}
.endline>span:first-child{display:flex;align-items:center;gap:4px}
.endline img{width:28px;height:28px;margin:-6px -2px -6px -6px}
.endline .mono{font-family:var(--mono)}
::selection{background:var(--acc-soft);color:var(--ink)}
a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--acc);outline-offset:4px}
.scroll{scrollbar-color:var(--line3) var(--panel)}
.paper>*{min-width:0}
@media (max-width:760px){.finding,.observation,.band-item{grid-template-columns:minmax(0,1fr);gap:14px}.cards{grid-template-columns:minmax(0,1fr)}.observation-context{flex-direction:row;flex-wrap:wrap;align-items:baseline}.finding h3{font-size:17px}.paper{gap:44px}}
@media (max-width:640px){.page{padding:16px 0 32px}.meta{border-left:0;padding-left:0;grid-template-columns:minmax(0,1fr)}.chip{white-space:normal}.chart{grid-template-columns:96px minmax(0,1fr)}.chart .lbl{grid-column:2;padding-top:0}.reason-pair,:lang(zh-CN) .reason-pair{grid-template-columns:minmax(0,1fr);gap:4px}.line>span:last-child{min-width:0;flex-basis:100%}}
@page{size:A4;margin:14mm 12mm}
@media print{
  html,body{background:#fff}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .page{padding:0;font-size:12.5px}
  /* Block flow lets Chrome honour break-avoid rules, which flex containers ignore. */
  .paper{box-shadow:none!important;padding:0!important;max-width:none;display:block}
  .paper>*+*{margin-top:40px}
  section.sec{display:block}
  section.sec>*+*{margin-top:18px}
  .opps-wrap{display:block}
  .matrix-box{max-width:420px;margin-top:28px}
  .scroll{overflow:visible}
  table.w880,table.w760,table.w640,.cal{min-width:0!important}
  .metrics-table{min-width:0}
  .landscape-table{min-width:0!important}
  .landscape-table .profile-col{width:18%;min-width:0}
  .landscape-table .class-col{width:auto}
  td,th{padding:7px 8px}
  .sec-head{break-after:avoid-page;break-inside:avoid-page}
  /* Reserve room under each heading so it never ends a page without its content. */
  .sec-head::after{content:"";display:block;width:100%;height:300px;margin-bottom:-300px}
  footer.foot{margin-top:24px}
  .sub{display:block}
  .sub>*+*{margin-top:12px}
  .sub>h3,.subhead{break-after:avoid-page;break-inside:avoid-page}
  .sub>h3::after,.subhead::after{content:"";display:block;width:100%;height:140px;margin-bottom:-140px}
  .swot{break-inside:avoid-page}
  tr,.card,.pcard,.tile,.quad,.opp,.stage,.chart>*{break-inside:avoid-page}
  .band{margin:40px 0 0;padding:24px}
  .finding,.observation,.band-item{grid-template-columns:minmax(0,1fr);gap:10px}
  .band,.observation-list,.opps{break-inside:auto}
  .finding,.observation,.band-item,.sources li{break-inside:avoid-page}
  p{orphans:3;widows:3}
  .sources li:target{background:none}
  a{color:inherit}
}
</style>
</head>
<body>
<div class="page">
