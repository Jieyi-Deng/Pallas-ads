<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>$title</title>
<style>
:root{color-scheme:light;--ink:#203439;--muted:#617277;--accent:#087c83;--warm:#b25836;--line:#dce5e4}
*{box-sizing:border-box}body{margin:0;background:#f4f6f3;color:var(--ink);font:16px/1.75 system-ui,-apple-system,sans-serif}
main{max-width:1140px;margin:auto;padding:48px 28px 72px}header{padding-bottom:28px;border-bottom:1px solid var(--line)}
h1{font-size:36px;line-height:1.3;letter-spacing:-.02em;margin:10px 0}h2{font-size:26px;line-height:1.4;margin:0 0 24px}h3{font-size:20px;line-height:1.5;margin:0 0 12px}h4{margin:16px 0 6px}
p{margin:10px 0}a{color:var(--accent);text-underline-offset:4px}nav{display:flex;gap:22px;flex-wrap:wrap;margin-top:20px}
section{padding-top:44px}.eyebrow,.muted,figcaption,.chart-note{color:var(--muted)}.eyebrow{font-size:13px;letter-spacing:.1em}.lead{font-size:19px;max-width:880px}
.panel,article{background:white;border:1px solid var(--line);border-radius:12px;padding:24px;margin:20px 0}.notice{border-left:3px solid var(--accent);padding:12px 18px;background:#e9f2ef}
.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:24px 0}.metric{padding:18px;background:white;border:1px solid var(--line);border-radius:10px}.metric dt{color:var(--muted);font-size:14px}.metric dd{margin:8px 0 0;font-size:25px;font-weight:650;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}.unit{font-size:12px;color:var(--muted)}
.table-wrap{overflow:auto;margin:16px 0}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:11px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}th{color:var(--muted);font-weight:550}th.number,td.number{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
figure{margin:20px 0}svg{width:100%;height:auto;display:block;font:14px system-ui,sans-serif}figcaption{font-size:13px;margin-top:10px}.chart-scroll{overflow-x:auto}.chart-scroll svg{min-width:680px}.badge{font-size:12px;color:var(--accent);font-weight:650;letter-spacing:.04em}.reason{border-left:2px solid var(--line);padding-left:16px}.evidence-links{display:flex;gap:12px 24px;flex-wrap:wrap}.summary-list li{margin:12px 0}.small{font-size:13px}footer{margin-top:30px;border-top:1px solid var(--line);padding-top:18px;color:var(--muted);font-size:13px}
@media(max-width:680px){main{padding:24px 16px}h1{font-size:28px}h2{font-size:23px}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.metric dd{font-size:20px}article,.panel{padding:18px}nav{gap:12px}}
@media print{body{background:white}main{max-width:none;padding:0}nav{display:none}article,figure,.metric{break-inside:avoid}.chart-scroll svg{min-width:0}a{color:inherit}}
</style>
</head>
<body><main>
<header><div class="eyebrow">PALLAS · 投放分析</div><h1>$title</h1><p class="lead">$subtitle</p>
<nav aria-label="报告导航"><a href="#overview">账户与期间总结</a><a href="#changes">变化与原因拆解</a><a href="#recommendations">主要发现与建议</a></nav></header>
<section id="overview" aria-labelledby="overview-title"><h2 id="overview-title">一、账户与期间总结</h2>$overview</section>
<section id="changes" aria-labelledby="changes-title"><h2 id="changes-title">二、变化与原因拆解</h2>$changes</section>
<section id="recommendations" aria-labelledby="recommendations-title"><h2 id="recommendations-title">三、主要发现与建议</h2>$recommendations
<footer><p>指标保留两位小数，舍入后为整数时不显示小数部分；百分比先换算再显示。日期、账户和系列标识保留原样。展示舍入不影响底层计算，原始精度保存在本地证据文件。</p>$evidence_links</footer></section>
</main></body></html>
