:root{color-scheme:light;--ink:#1b2029;--muted:#58616e;--accent:#087c83;--line:#dce1e6;--paper:#fff;--soft:#f5f6f8}
*{box-sizing:border-box}html{scroll-padding-top:24px}body{margin:0;background:var(--soft);color:var(--ink);font:16px/1.75 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
::selection{background:#d4e9e7;color:var(--ink)}main{max-width:1080px;margin:0 auto;padding:48px 56px 72px;background:var(--paper)}header{padding-bottom:24px;border-bottom:2px solid var(--ink)}.brand{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:650;margin-bottom:22px}.brand img{width:32px;height:32px;object-fit:contain}
h1{font-size:36px;line-height:1.3;letter-spacing:-.025em;margin:0 0 12px;text-wrap:balance}h2{font-size:25px;line-height:1.4;margin:0 0 24px;letter-spacing:-.015em}h3{font-size:22px;line-height:1.5;margin:0 0 12px;text-wrap:pretty}h4{font-size:16px;margin:20px 0 6px}p{margin:10px 0;max-width:75ch}.lead{font-size:18px;color:var(--muted)}a{color:var(--accent);text-underline-offset:4px;text-decoration-thickness:1px}a:hover{text-decoration-thickness:2px}a:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:2px}
nav{display:flex;gap:12px 28px;flex-wrap:wrap;margin-top:24px;font-size:14px}nav a{padding:4px 0}section{padding-top:40px}section+section{margin-top:40px;border-top:2px solid var(--ink)}.scope{display:flex;flex-wrap:wrap;gap:8px 24px;font-size:14px;color:var(--muted);margin:0 0 20px}.scope strong{color:var(--ink)}.takeaway{padding:22px 0 26px}.takeaway p:first-child{font-size:24px;line-height:1.55;font-weight:550;letter-spacing:-.015em;max-width:65ch}.takeaway .next{font-size:16px;color:var(--muted)}.notice{font-size:14px;line-height:1.7;padding:14px 18px;background:var(--soft);margin:16px 0;max-width:none}.muted,.small,.unit,figcaption,.chart-note{color:var(--muted)}.small,.unit,figcaption,.chart-note{font-size:13px;line-height:1.65}
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;margin:0 0 20px;padding:22px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.metric{min-width:0}.metric dt{font-size:14px;color:var(--muted)}.metric dd{margin:8px 0 2px;font-size:27px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}.metric .unit{display:block}
article{padding:0 0 32px;margin:0 0 32px;border-bottom:1px solid var(--line);min-width:0}article:last-child{border-bottom:0;margin-bottom:0;padding-bottom:0}.panel{margin:20px 0}.reason{margin:20px 0}.badge{font-size:13px;font-weight:600;color:var(--muted)}.finding-note{font-size:14px;color:var(--muted)}.source-link{font-size:14px;margin-top:18px}.action-list{list-style:none;padding:0;margin:12px 0}.action-list>li{padding:20px 0;border-top:1px solid var(--line)}.action-list h3{font-size:19px;margin:4px 0 8px}.action-stage{font-size:13px;font-weight:650;color:var(--muted)}.action-list p{margin:6px 0}.summary-list{padding-left:22px}.summary-list li{margin:10px 0}
.table-wrap{overflow-x:auto;max-width:100%;margin:18px 0;scrollbar-color:#8d999e var(--soft)}table{width:100%;border-collapse:collapse;font-size:14px;line-height:1.65}th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}th{color:var(--muted);font-weight:550;background:var(--soft)}th.number,td.number{text-align:right;white-space:nowrap}
figure{margin:24px 0}svg{width:100%;height:auto;display:block;font:14px system-ui,sans-serif}.chart-scroll{overflow-x:auto;max-width:100%;scrollbar-color:#8d999e var(--soft)}.chart-scroll svg{min-width:680px}figcaption{margin-top:10px;max-width:80ch}.evidence-links{display:flex;gap:10px 24px;flex-wrap:wrap;font-size:14px}footer{margin-top:36px;padding-top:24px;border-top:1px solid var(--line)}footer h3{font-size:18px}footer p{font-size:13px;color:var(--muted)}
@media(max-width:700px){main{padding:28px 20px 48px}h1{font-size:29px}h2{font-size:23px}h3{font-size:20px}.takeaway p:first-child{font-size:21px}.metrics{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 16px}.metric dd{font-size:25px}section{padding-top:30px}section+section{margin-top:28px}nav{gap:8px 18px}.scope{gap:6px 14px}th,td{padding:10px}.chart-scroll svg{min-width:620px}}
@media print{@page{size:auto;margin:16mm 14mm}body{background:white;font-size:11pt;line-height:1.6}main{max-width:none;padding:0}header{padding-bottom:12pt}nav{display:none}h1{font-size:24pt}h2{font-size:18pt}h3{font-size:15pt}h1,h2,h3,h4{break-after:avoid}p{orphans:3;widows:3}section{padding-top:22pt}section+section{margin-top:22pt}.takeaway p:first-child{font-size:16pt}.metrics{gap:12pt;padding:12pt 0}.metric dd{font-size:18pt}.small,.unit,figcaption,.chart-note{font-size:9pt}article{break-inside:auto}.metric,figure,.action-list>li,tr{break-inside:avoid}.chart-scroll,.table-wrap{overflow:visible}.chart-scroll svg{min-width:0;width:100%}table{font-size:10pt}th,td{padding:7pt;overflow-wrap:anywhere}a{color:inherit}footer{margin-top:18pt}}
.compact-bars,.mobile-trend{display:none}.compact-bar{padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}.compact-bar-value{display:grid;grid-template-columns:minmax(0,1fr) 90px;gap:16px;align-items:center;margin-top:8px}.compact-bar-value strong{text-align:right;font-weight:600}.bar-track{position:relative;height:20px}.bar-zero{position:absolute;top:0;bottom:0;width:1px;background:#879396}.bar-fill{position:absolute;top:4px;height:12px}.mobile-trend svg{font-size:13px}
