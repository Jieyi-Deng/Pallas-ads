name: Installer checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test/*.test.mjs
      - run: node bin/pallas-ads.mjs --help
