name: Publisher checks
on:
  pull_request:
    paths:
      - '.github/workflows/npm-publish.yml'
      - '.github/workflows/publish-checks.yml'
      - 'tools/npm_publish.py'
      - 'test/test_npm_publish.py'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  publisher:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check offline publication guards
        run: python -m unittest discover -s test -p test_npm_publish.py -v
